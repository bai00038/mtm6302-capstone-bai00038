<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- google font -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- custom css link-->
    <link rel="stylesheet" href="./style.css">
    <title>Capstone</title>
</head>

<body>
    <header>
        <h1 class="fs-2 pt-3 text-center fw-600">Capstone</h1> <!-- logo -->
    </header>
    <main>
        <!-- display image -->
        <section class="main_display_section" id="main_display_section">
            <div id="main_display">
                <input class="date_picker mb-3 mt-3" id="date_picker" type="date"> <!-- date picker -->
                <img id="main_image" src="" alt="main image">
                <div class="title_content">
                    <div>
                        <h2 id="main_image_title" class="main_image_title fs-4 mt-3"></h2>
                        <p id="main_image_description" class="main_image_description mb-4"></p>
                    </div>
                    <img id="icon_favourite" class="icon_favourite" src="./images/favourite_default.svg"
                        alt="add to my favourite">
                </div>
            </div>

        </section>
        <!-- my favourite -->
        <section class="my_favourite_section" id="my_favourite_section">
            <h2 class="favourite_title fs-3" id="favourite_title">My Favourite</h2>
            <p class="favourite_empty" id="favourite_empty"></p>
            <div class="favourite_list" id="favourite_list"></div>
        </section>
        <section id="hd_modal" class="hd_modal">
            <span id="hd_close" class="hd_close">&times;</span>
            <img id="hd_image" class="hd_image" src="" alt="HD image">
        </section>
    </main>
    <footer>
    </footer>
    <script src="./script.js"></script>
</body>

</html>
